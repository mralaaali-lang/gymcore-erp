# ====================================================================
# Gimawi SaaS — CI/CD Pipeline
# Triggers: push to main, pull requests to main
# ====================================================================

name: Gimawi CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ==================================================================
  # Job 1: Quality & Tests
  # ==================================================================
  quality:
    name: Quality & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gimawi_test
          POSTGRES_USER: gimawi
          POSTGRES_PASSWORD: gimawi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Run database migrations
        working-directory: ./server
        env:
          DATABASE_URL: postgres://gimawi:gimawi_test@localhost:5432/gimawi_test
          JWT_SECRET: test-jwt-secret-for-ci
          QR_SECRET_SALT: test-qr-salt-for-ci
        run: npm run migrate

      - name: Run backend tests
        working-directory: ./server
        env:
          DATABASE_URL: postgres://gimawi:gimawi_test@localhost:5432/gimawi_test
          JWT_SECRET: test-jwt-secret-for-ci
          QR_SECRET_SALT: test-qr-salt-for-ci
        run: npm test

      - name: Install frontend dependencies
        working-directory: ./
        run: npm ci

      - name: Lint frontend
        working-directory: ./
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        working-directory: ./
        run: npm run build

  # ==================================================================
  # Job 2: Docker Build & Push
  # ==================================================================
  docker:
    name: Build & Push Docker Images
    needs: quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/gimawi-backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/gimawi-frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================================================================
  # Job 3: Deploy to Production (SSH)
  # ==================================================================
  deploy:
    name: Deploy to Production
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd /opt/gimawi
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
