# ====================================================================
# GitHub Actions — Deploy to Railway Staging ONLY
# ====================================================================
# Railway Trial Notes:
# - Trial credit: $5/month (expires, not permanent free hosting)
# - Services sleep after inactivity (cold start ~10-30s)
# - No Docker Compose — each service is separate (Backend, Frontend, PostgreSQL, Redis)
# - Services communicate via internal Railway network (private IPs)
# - Variables/Secrets set per service in Railway dashboard or CLI
# ====================================================================

name: Deploy to Railway Staging

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/**'
      - 'Dockerfile.prod'
      - 'server/Dockerfile.prod'
      - 'nginx.conf'
      - 'package.json'
      - 'package-lock.json'
      - 'server/package.json'
      - 'server/package-lock.json'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test suite (not recommended)'
        required: false
        default: 'false'
        type: boolean
      railway_environment:
        description: 'Railway environment name'
        required: false
        default: 'staging'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend
  RAILWAY_ENVIRONMENT: ${{ github.event.inputs.railway_environment || 'staging' }}

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------
  # 1. Lint & TypeCheck (fast, runs first)
  # ---------------------------------------------------------
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci --prefer-offline --no-audit

      - name: Lint root (if script exists)
        run: npm run lint 2>/dev/null || echo "No root lint script"

      - name: Install server deps
        working-directory: ./server
        run: npm ci --prefer-offline --no-audit

      - name: Lint server
        working-directory: ./server
        run: npm run lint

      - name: TypeCheck server
        working-directory: ./server
        run: npx tsc --noEmit

  # ---------------------------------------------------------
  # 2. Test Suite (with PostgreSQL + Redis services)
  # ---------------------------------------------------------
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_DB: gymcore_test
          POSTGRES_USER: gymcore
          POSTGRES_PASSWORD: gymcore_secret
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U gymcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci --prefer-offline --no-audit

      - name: Install server deps
        working-directory: ./server
        run: npm ci --prefer-offline --no-audit

      - name: Run migrations
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://gymcore:gymcore_secret@localhost:5432/gymcore_test
          JWT_SECRET: test-secret-change-in-production
          QR_SECRET_SALT: test-qr-salt
        run: npm run migrate

      - name: Run unit tests
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://gymcore:gymcore_secret@localhost:5432/gymcore_test
          JWT_SECRET: test-secret-change-in-production
          QR_SECRET_SALT: test-qr-salt
          REDIS_URL: redis://localhost:6379
        run: npm run test:unit

      - name: Run integration tests
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://gymcore:gymcore_secret@localhost:5432/gymcore_test
          JWT_SECRET: test-secret-change-in-production
          QR_SECRET_SALT: test-qr-salt
          REDIS_URL: redis://localhost:6379
        run: npm run test:int

  # ---------------------------------------------------------
  # 3. Build & Push Docker Images to GHCR
  # ---------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ env.RAILWAY_ENVIRONMENT }},enable={{is_default_branch}}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ env.RAILWAY_ENVIRONMENT }},enable={{is_default_branch}}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------
  # 4. Deploy to Railway (Backend + Frontend)
  # ---------------------------------------------------------
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli@latest

      - name: Login to Railway
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Link to Railway Project
        run: railway link --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment ${{ env.RAILWAY_ENVIRONMENT }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Backend Service
        id: deploy-backend
        run: |
          railway up \
            --service ${{ secrets.RAILWAY_SERVICE_BACKEND }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ env.RAILWAY_ENVIRONMENT }} \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend Service
        id: deploy-frontend
        run: |
          railway up \
            --service ${{ secrets.RAILWAY_SERVICE_FRONTEND }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ env.RAILWAY_ENVIRONMENT }} \
            --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for Deployments
        run: |
          echo "Waiting for services to become healthy..."
          sleep 45

      - name: Get Service URLs
        id: urls
        run: |
          BACKEND_URL=$(railway status --service ${{ secrets.RAILWAY_SERVICE_BACKEND }} --json | jq -r '.deployments[0].url // empty')
          FRONTEND_URL=$(railway status --service ${{ secrets.RAILWAY_SERVICE_FRONTEND }} --json | jq -r '.deployments[0].url // empty')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_OUTPUT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Set Railway Variables (Backend)
        if: steps.urls.outputs.BACKEND_URL != ''
        run: |
          railway variables set \
            --service ${{ secrets.RAILWAY_SERVICE_BACKEND }} \
            DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
            REDIS_URL="${{ secrets.STAGING_REDIS_URL }}" \
            JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}" \
            QR_SECRET_SALT="${{ secrets.STAGING_QR_SECRET }}" \
            CORS_ORIGIN="${{ steps.urls.outputs.FRONTEND_URL }}" \
            ENCRYPTION_KEY="${{ secrets.STAGING_ENCRYPTION_KEY }}" \
            NODE_ENV=staging \
            TRUST_PROXY=true \
            SEED_PLAYGROUND=true \
            LOG_LEVEL=info \
            SENTRY_DSN="${{ secrets.STAGING_SENTRY_DSN }}" \
            SMTP_HOST="${{ secrets.STAGING_SMTP_HOST }}" \
            SMTP_PORT="${{ secrets.STAGING_SMTP_PORT }}" \
            SMTP_USER="${{ secrets.STAGING_SMTP_USER }}" \
            SMTP_PASS="${{ secrets.STAGING_SMTP_PASS }}" \
            FRONTEND_URL="${{ steps.urls.outputs.FRONTEND_URL }}" \
            PORT=4000
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Set Railway Variables (Frontend)
        if: steps.urls.outputs.FRONTEND_URL != ''
        run: |
          railway variables set \
            --service ${{ secrets.RAILWAY_SERVICE_FRONTEND }} \
            VITE_API_URL="${{ steps.urls.outputs.BACKEND_URL }}/api/v1" \
            NODE_ENV=production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Restart Services to Pick Up Variables
        if: steps.urls.outputs.BACKEND_URL != ''
        run: |
          railway service restart --service ${{ secrets.RAILWAY_SERVICE_BACKEND }}
          railway service restart --service ${{ secrets.RAILWAY_SERVICE_FRONTEND }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for Restart
        run: sleep 30

  # ---------------------------------------------------------
  # 5. Post-Deploy Smoke Tests
  # ---------------------------------------------------------
  smoke-tests:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-railway
    if: always()
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli@latest

      - name: Login
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Link Project
        run: railway link --project ${{ secrets.RAILWAY_PROJECT_ID }} --environment ${{ env.RAILWAY_ENVIRONMENT }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get Service URLs
        id: urls
        run: |
          BACKEND_URL=$(railway status --service ${{ secrets.RAILWAY_SERVICE_BACKEND }} --json | jq -r '.deployments[0].url // empty')
          FRONTEND_URL=$(railway status --service ${{ secrets.RAILWAY_SERVICE_FRONTEND }} --json | jq -r '.deployments[0].url // empty')
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_OUTPUT
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health Check API
        if: steps.urls.outputs.BACKEND_URL != ''
        run: |
          echo "Testing ${{ steps.urls.outputs.BACKEND_URL }}/health"
          curl -f --max-time 30 "${{ steps.urls.outputs.BACKEND_URL }}/health" || exit 1

      - name: Health Check Frontend
        if: steps.urls.outputs.FRONTEND_URL != ''
        run: |
          echo "Testing ${{ steps.urls.outputs.FRONTEND_URL }}"
          curl -f --max-time 30 "${{ steps.urls.outputs.FRONTEND_URL }}" || exit 1

      - name: Test Staging Login (Super Admin)
        if: steps.urls.outputs.BACKEND_URL != ''
        run: |
          echo "Testing super-admin login..."
          curl -X POST "${{ steps.urls.outputs.BACKEND_URL }}/platform/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"${{ secrets.STAGING_SUPER_ADMIN_EMAIL }}","password":"${{ secrets.STAGING_SUPER_ADMIN_PASSWORD }}"}' \
            -f --max-time 30 || echo "Login test failed (expected if no super admin seeded)"

      - name: Test Member Login Flow
        if: steps.urls.outputs.BACKEND_URL != ''
        run: |
          echo "Testing member login endpoint exists..."
          curl -X POST "${{ steps.urls.outputs.BACKEND_URL }}/auth/member-login" \
            -H "Content-Type: application/json" \
            -d '{"phone":"+966500000001","pin":"1234"}' \
            --max-time 30 || true

      - name: Summary
        run: |
          echo "✅ Railway Staging Deployment Complete"
          echo "🔗 Backend API: ${{ steps.urls.outputs.BACKEND_URL }}"
          echo "🌐 Frontend: ${{ steps.urls.outputs.FRONTEND_URL }}"
          echo ""
          echo "⚠️  RAILWAY TRIAL REMINDER:"
          echo "   - Trial credit: $5/month (EXPIRES - not permanent free)"
          echo "   - Services sleep after inactivity (cold start 10-30s)"
          echo "   - No real member/collection data — only seedPlayground dummy data"
          echo "   - Monitor usage at: https://railway.app/project/${{ secrets.RAILWAY_PROJECT_ID }}"