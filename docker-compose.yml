name: gymcore-erp

# ====================================================================
# GymCore ERP — Local Production-Like Environment
# ====================================================================


services:
  # ==================================================================
  # PostgreSQL Database
  # ==================================================================
  postgres:
    image: postgres:17-alpine
    container_name: gymcore-db
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymcore}
      POSTGRES_USER: ${POSTGRES_USER:-gymcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymcore_secret}
    ports:
      - "5433:5432"
    volumes:
      # postgres17_data starts empty and receives the full schema+data restored
      # from the merged native-PG17 dump (backups/gymcore_local_premerge_*.dump).
      # The old ./server/migrations initdb mount is removed deliberately: it
      # would replay all 56 migration SQL files on first boot of an empty
      # volume and collide with the restored objects. Migrations advance via
      # the backend runner only (idempotent, md5-tracked).
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - gymcore-net

  # ==================================================================
  # Redis — Queue & Caching
  # ==================================================================
  redis:
    image: redis:7-alpine
    container_name: gymcore-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - gymcore-net

  # ==================================================================
  # Mailpit — SMTP Email Testing  (Web UI → http://localhost:8025)
  # Only started in dev mode: docker compose --profile dev up mailpit
  # ==================================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: gymcore-mailpit
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - gymcore-net

  # ==================================================================
  # Backend — Express API Server
  # ==================================================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gymcore-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-gymcore}:${POSTGRES_PASSWORD:-gymcore_secret}@postgres:5432/${POSTGRES_DB:-gymcore}
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASS: ""
      TRUST_PROXY: "true"
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "4001:4000"
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - gymcore-net

  # ==================================================================
  # Frontend — Nginx + Vite Static Build
  # ==================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymcore-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9000:80"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - gymcore-net

volumes:
  postgres17_data:
    driver: local
  # Legacy PG-13 volume kept declared for one-release rollback (pre-merge data):
  postgres_data:
    driver: local
  backend_logs:
    driver: local

networks:
  gymcore-net:
    driver: bridge
