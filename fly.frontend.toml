# ====================================================================
# Fly.io Configuration — GymCore ERP Staging (Frontend)
# ====================================================================
# Usage:
#   fly apps create gymcore-frontend-staging --org personal
#   fly secrets set VITE_API_URL=https://gymcore-backend-staging.fly.dev/api/v1
#   fly deploy --config fly.frontend.toml
# ====================================================================

app = "gymcore-frontend-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.prod"
  context = "."

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "256MB"

# Optional: Custom domain
# [[services.ports]]
#   port = 443
#   handlers = ["tls", "http"]
# [[services.ports]]
#   port = 80
#   handlers = ["http"]